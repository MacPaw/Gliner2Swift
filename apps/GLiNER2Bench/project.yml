# XcodeGen spec for the GLiNER2 on-device benchmark app.
#
#   brew install xcodegen
#   cd apps/GLiNER2Bench && xcodegen generate
#   open GLiNER2Bench.xcodeproj
#
# Then set the signing team (Signing & Capabilities), pick your iPhone, and Run.
# See README.md for getting the model onto the device.

name: GLiNER2Bench
options:
  bundleIdPrefix: com.example.gliner2bench
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GLiNER2Swift:
    # The library lives two levels up from this spec.
    path: ../..

targets:
  GLiNER2Bench:
    type: application
    platform: iOS
    sources:
      - Sources
      # Uncomment after dragging a converted fp16 model directory in here as "Model".
      # - path: Model
      #   type: folder
    dependencies:
      - package: GLiNER2Swift
        product: GLiNER2Swift
      - package: GLiNER2Swift
        product: Hub
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gliner2bench
        # Set your team here or in Xcode's Signing & Capabilities.
        # DEVELOPMENT_TEAM: XXXXXXXXXX
